<title>Rota ANPD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra de abas fixa no topo + coluna única de 960px; cartões só onde há ação. Identidade: azul-cobalto institucional, citações legais em mono. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --sunk:#E9EDF4; --ink:#121C2E; --muted:#596379; --line:#D8DEE8;
  --accent:#2445C2; --accent-ink:#FFFFFF; --accent-soft:#E3E8FA;
  --good:#1D7F47; --good-soft:#E1F3E8; --warn:#9A6212; --warn-soft:#FBF0DC; --bad:#BC2F25; --bad-soft:#FBE5E2;
  --h0:#E3E8F2; --h1:#BCC8F2; --h2:#8099E6; --h3:#4A67D3; --h4:#2445C2;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#151D2C; --sunk:#1B2436; --ink:#E6EBF4; --muted:#9AA5BA; --line:#283349;
  --accent:#8BA2FF; --accent-ink:#0D1320; --accent-soft:#1E2A4E;
  --good:#5BC98C; --good-soft:#15301F; --warn:#E5B062; --warn-soft:#33270F; --bad:#F27B70; --bad-soft:#3A1A17;
  --h0:#1E2738; --h1:#24366B; --h2:#33509E; --h3:#5A78D6; --h4:#8BA2FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#151D2C; --sunk:#1B2436; --ink:#E6EBF4; --muted:#9AA5BA; --line:#283349;
  --accent:#8BA2FF; --accent-ink:#0D1320; --accent-soft:#1E2A4E;
  --good:#5BC98C; --good-soft:#15301F; --warn:#E5B062; --warn-soft:#33270F; --bad:#F27B70; --bad-soft:#3A1A17;
  --h0:#1E2738; --h1:#24366B; --h2:#33509E; --h3:#5A78D6; --h4:#8BA2FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.45rem} h3{font-size:1.1rem}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 4px}
.brand b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:-.01em}
.brand b span{color:var(--accent)}
.sync{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:600;font-size:.95rem;padding:8px 12px;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 60px;display:grid;gap:20px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.grid2>*{min-width:0}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.ref{font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);color:var(--ink);padding:2px 7px;border-radius:4px;white-space:nowrap}
.chip{font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
/* Hero de hoje */
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.daynum{font-family:var(--f-display);font-size:4.2rem;font-weight:700;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.hero p{margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stats div{background:var(--surface);padding:12px 14px}
.stats b{display:block;font-family:var(--f-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.daynum{font-size:3.2rem}}
/* Metas */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tasks li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tasks li.done{background:var(--sunk)}
.tasks li.done .tl{text-decoration:line-through;color:var(--muted)}
.tasks input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.tasks .tl{font-weight:600}
.tasks small{display:block;color:var(--muted);font-weight:400}
.tasks .mins{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* Alertas */
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);align-items:start}
.alert .pill{font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;white-space:nowrap}
.alert.bad{background:var(--bad-soft)} .alert.bad .pill{background:var(--bad);color:var(--surface)}
.alert.warn{background:var(--warn-soft)} .alert.warn .pill{background:var(--warn);color:var(--surface)}
.alert.good{background:var(--good-soft)} .alert.good .pill{background:var(--good);color:var(--surface)}
.alert b{display:block}
.alert span{font-size:.92rem;color:var(--ink)}
/* Questões */
.q{display:grid;gap:14px}
.q .stmt{font-size:1.08rem;max-width:68ch}
.opts{display:grid;gap:8px}
.opts button{text-align:left;font-weight:400;display:grid;grid-template-columns:28px 1fr;gap:8px}
.opts button b{font-family:var(--f-mono)}
.opts button.ok,.ce button.ok{border-color:var(--good);background:var(--good-soft);opacity:1}
.opts button.no,.ce button.no{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.ce{display:flex;gap:10px}.ce button{flex:1}
.feedback{border-left:4px solid var(--good);padding:8px 12px;background:var(--sunk);border-radius:0 8px 8px 0}
.feedback.no{border-color:var(--bad)}
.qnav{display:flex;gap:4px;flex-wrap:wrap}
.qnav span{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;font-family:var(--f-mono);font-size:.75rem;background:var(--sunk);color:var(--muted)}
.qnav span.cur{outline:2px solid var(--accent)}
.qnav span.sel{background:var(--accent-soft);color:var(--accent)}
.opts button.sel,.ce button.sel{border-color:var(--accent);background:var(--accent-soft);opacity:1}
.qnav span.ok{background:var(--good);color:var(--surface)} .qnav span.no{background:var(--bad);color:var(--surface)}
/* Ciclo */
.cycle{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.cyc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem;background:var(--surface)}
.cyc .n{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.cyc.done{background:var(--sunk);color:var(--muted)}
.cyc.next{border:2px solid var(--accent)}
.phases{display:grid;gap:10px}
.phase{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.phase.now .ph{color:var(--accent)}
.ph{font-family:var(--f-mono);font-size:.78rem}
@media (max-width:560px){.phase{grid-template-columns:1fr;gap:4px}}
/* Guias */
details.topic{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.topic summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center}
details.topic summary input{width:18px;height:18px;accent-color:var(--accent)}
details.topic .body{padding:0 14px 14px 42px}
details.topic ul{margin:0;padding-left:18px;display:grid;gap:4px;max-width:70ch}
.trap{margin-top:10px;font-size:.92rem;padding:8px 10px;border-radius:6px;background:var(--warn-soft)}
.trap b{color:var(--warn)}
.disc-pick{display:flex;gap:6px;flex-wrap:wrap}
.disc-pick button{font-size:.88rem;padding:6px 11px}
.disc-pick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* Timeline */
.tl-item{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.tl-item .when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.tl-item p{margin:6px 0;max-width:68ch}
@media (max-width:560px){.tl-item{grid-template-columns:1fr;gap:4px}}
/* Gráficos */
.chart{overflow-x:auto}
.chart svg{display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.hbar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:.88rem;padding:3px 0}
.hbar .t{height:12px;background:var(--sunk);border-radius:0 4px 4px 0;position:relative}
.hbar .t i{position:absolute;inset:0 auto 0 0;background:var(--h3);border-radius:0 4px 4px 0}
.hbar .t .goal{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:70%}
.hbar .v{font-family:var(--f-mono);font-size:.8rem;text-align:right}
.legend{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
table.plan{border-collapse:collapse;width:100%;font-size:.92rem}
table.plan th,table.plan td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.plan th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto}
ol.rules{margin:0;padding-left:20px;display:grid;gap:8px;max-width:72ch}
.note{font-size:.88rem;color:var(--muted);max-width:72ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20}
@media (prefers-reduced-motion:no-preference){.bar i,.hbar .t i{transition:width .4s ease}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Rota <span>ANPD</span> · Jullio</b><span class="sync" id="sync">conectando…</span></div>
    <nav class="tabs" id="tabs">
      <a href="#hoje">Hoje</a><a href="#simulado">Simulado</a><a href="#relatorio">Relatório</a><a href="#ciclo">Ciclo</a><a href="#guias">Guias</a><a href="#redacao">Redação</a><a href="#progresso">Progresso</a><a href="#plano">Plano</a><a href="#novidades">Novidades</a><a href="#ajustes">Notificações e download</a>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script>
// ======== ESTADO ========
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const diffDays = (a,b) => Math.round((parseKey(b)-parseKey(a))/864e5);
const TODAY = () => keyOf(new Date());
const fmtDate = k => parseKey(k).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
const WEEKDAY = k => parseKey(k).toLocaleDateString("pt-BR",{weekday:"long"});

function blank(){ return {v:2,start:TODAY(),minutes:120,cyclePos:0,topicPos:{},days:{},log:[],err:{},guide:{},aiQ:[],notif:{on:false,time:"19:00",sent:{}}}; }
const IN_CLAUDE = !!(window.claude && window.claude.use);
const SITE_URL = "https://rota-anpd.vercel.app";
let ready = false;
let S = blank(), db = null, docRef = null, saveTimer = null, storeMode = "local", sample = null;

function allQ(){ return QB.concat(S.aiQ||[]); }
function qById(id){ return allQ().find(q=>q.id===id); }

async function boot(){
  render();
  let loaded = false;
  try{
    if(!IN_CLAUDE) throw new Error("standalone");
    const [dbx,user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    if(dbx && uid){
      db = dbx; docRef = db.doc("data/users/"+uid+"/state");
      const timer = setTimeout(()=>{ if(!loaded) setSync("sem conexão com o servidor; salvando neste navegador"); },10000);
      const snap = await docRef.get();
      clearTimeout(timer); loaded = true;
      if(snap.exists){ S = Object.assign(blank(), snap.data()); S = JSON.parse(JSON.stringify(S)); }
      else { const l = readLocal(); if(l) S = l; }
      storeMode = "db"; setSync("progresso salvo na sua conta");
    } else { const l = readLocal(); if(l) S = l; setSync("salvando neste navegador"); }
  }catch(e){ const l = readLocal(); if(l) S = l; setSync("salvando neste navegador"); }
  ready = true; ensureDay(); save(); render();
  if(!S.notif) S.notif={on:false,time:"19:00",sent:{}};
  if(IN_CLAUDE){ try{ sample = await window.claude.use("sample"); if(sample && location.hash==="#simulado") render(); }catch(e){} }
  else { setupPWA(); notifTick(); setInterval(notifTick,60000); }
}
function readLocal(){ try{ const t = localStorage.getItem("rota-anpd"); return t ? Object.assign(blank(), JSON.parse(t)) : null; }catch(e){ return null; } }
function setSync(t){ $("#sync").textContent = t; }
function save(){
  if(!ready) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ localStorage.setItem("rota-anpd", JSON.stringify(S)); }catch(e){}
    if(storeMode==="db" && docRef){
      try{ await docRef.set(JSON.parse(JSON.stringify(S))); setSync("salvo às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})); }
      catch(e){ setSync(e && e.code==="quota_exceeded" ? "armazenamento cheio" : "falha ao salvar; tentaremos de novo"); }
    }
  },700);
}
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2200); }

// ======== PLANO DO DIA ========
function blocksFor(m){ return m<=60?1 : m<=120?2 : 3; }
function blockMin(m){ return m<=60?35 : m<=90?30 : m<=120?40 : 45; }
function markTask(type){ const d=S.days[TODAY()]; if(!d) return; const t=d.tasks.find(x=>x.type===type&&!x.done); if(t) t.done=true; }
function nextLei(){ const L=S.lei||{}; return LEI_BLOCKS.slice().sort((a,b)=>((L[a.id]||{}).n||0)-((L[b.id]||{}).n||0))[0]; }
const MODES={padrao:"padrão",recuperacao:"recuperação",revisao:"revisão",avanco:"avanço"};
function dayStrategy(k){
  const a=acc(addDays(k,-7),addDays(k,-1)), due=Object.keys(S.err).filter(i=>S.err[i].due<=k).length, wd=parseKey(k).getDay(), ph=phaseInfo().idx;
  let mode="padrao", why="Ritmo normal: avance no ciclo e mantenha as revisões.";
  if(a.n>=20 && a.p<0.6){ mode="recuperacao"; why="Acerto de "+Math.round(a.p*100)+"% nos últimos 7 dias. Hoje há um bloco a menos de teoria e um treino de pontos fracos."; }
  else if(due>=15){ mode="revisao"; why="Há "+due+" erros aguardando revisão. Hoje a revisão vem primeiro e é mais longa."; }
  else if(a.n>=30 && a.p>=0.8){ mode="avanco"; why="Acerto de "+Math.round(a.p*100)+"% nos últimos 7 dias. Hoje entra uma questão discursiva para subir o nível."; }
  if(wd===0) why+=" Domingo: simuladão cronometrado e check-in semanal.";
  if(wd===6) why+=" Sábado: dia da parte escrita e da lei seca.";
  return {mode,why,wd,ph};
}
function ensureDay(k=TODAY()){
  const ex=S.days[k];
  if(ex && (ex.v2 || k!==TODAY() || ex.tasks.some(t=>t.done) || Object.keys(ex.simAns||{}).length)) return ex;
  const st=dayStrategy(k), M=S.minutes, wd=st.wd, tp=Object.assign({}, S.topicPos), tasks=[];
  let n=blocksFor(M);
  if(st.mode==="recuperacao") n=Math.max(1,n-1);
  if(wd===0) n=1; else if(wd===6 && M<=120) n=Math.max(1,n-1);
  const T=(key,type,label,min,href)=>tasks.push({k:key,type,label,min,href,done:false});
  if(st.mode==="revisao") T("rev","rev","Revisão de erros (repetição espaçada)",25);
  for(let i=0;i<n;i++){
    const disc = CYCLE[(S.cyclePos+i)%CYCLE.length];
    const ti = (tp[disc]||0); tp[disc] = ti+1;
    const tl = GUIDES[disc].topics, top = tl[ti % tl.length];
    tasks.push({k:"b"+i, type:"block", disc, topic:ti % tl.length, lap: Math.floor(ti/tl.length), label:DISC[disc].s+": "+top.t, min:blockMin(M), done:false});
  }
  if(wd===0){ T("long","long","Simuladão cronometrado: 30 questões",45,"#simulado"); T("check","check","Check-in semanal: leia o Relatório e ajuste a semana",10,"#relatorio"); }
  else T("sim","sim","Simulado do dia: 10 questões",20);
  if(st.mode!=="revisao" && M>=90) T("rev","rev","Revisão de erros (repetição espaçada)",15);
  if(st.mode==="recuperacao") T("weak","weak","Treino de pontos fracos: 10 questões",20,"#relatorio");
  if(M>=90) T("flash","flash","Flashcards: 10 cartões",5,"#simulado");
  if(wd===6){ if(st.ph>=1) T("essay","essay","Redação completa (40 min, sem consulta)",40,"#redacao"); else T("disc","disc","Questão discursiva curta com espelho",15,"#redacao"); }
  else if((wd===3 && M>=90) || st.mode==="avanco") T("disc","disc","Questão discursiva curta com espelho",15,"#redacao");
  if(M>=180 || wd===6){ const lb=nextLei(); T("lei","lei","Lei seca: "+lb.n+", "+lb.p,15,"#ciclo"); }
  S.days[k] = {v2:1, mode:st.mode, why:st.why, tasks, simIds: ex?ex.simIds:pickSim(k), simAns:{}, simDone:false};
  save(); return S.days[k];
}
function toggleTask(k, key, val){
  const day = S.days[k]; const t = day.tasks.find(x=>x.k===key); if(!t || t.done===val) return;
  t.done = val;
  if(t.type==="block"){
    if(val){ S.cyclePos++; S.topicPos[t.disc]=(S.topicPos[t.disc]||0)+1; }
    else { S.cyclePos=Math.max(0,S.cyclePos-1); S.topicPos[t.disc]=Math.max(0,(S.topicPos[t.disc]||0)-1); }
  }
  save(); render();
  if(val && dayPct(k)>=1) toast("Meta do dia cumprida. Boa, Jullio!");
}
function dayPct(k){ const d=S.days[k]; if(!d) return 0; const t=d.tasks; return t.filter(x=>x.done).length/t.length; }
function dayCounts(k){ return dayPct(k) >= 0.6; }

// ======== SIMULADO ========
function rng(seed){ let h=2166136261; for(const c of seed) h=Math.imul(h^c.charCodeAt(0),16777619); return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%1e6)/1e6; }; }
function discStats(sinceKey){
  const st = {}; Object.keys(DISC).forEach(d=>st[d]={n:0,ok:0});
  for(const e of S.log){ const [k,id,ok] = e.split("|"); if(sinceKey && k<sinceKey) continue; const q=qById(id); if(!q) continue; st[q.d].n++; if(ok==="1") st[q.d].ok++; }
  return st;
}
function pickSim(k){
  const r = rng("sim"+k), seen = new Set(S.log.map(e=>e.split("|")[1]));
  const pool = allQ();
  const fresh = q => !seen.has(q.id);
  const take = (arr,n,out) => { arr = arr.filter(q=>!out.includes(q.id)).sort(()=>r()-.5); arr.sort((a,b)=>(fresh(b)?1:0)-(fresh(a)?1:0)); for(const q of arr.slice(0,n)) out.push(q.id); };
  const out = [];
  take(pool.filter(q=>q.d==="lgpd"||q.d==="anpd"),4,out);
  const st = discStats(); const weak = Object.keys(st).filter(d=>st[d].n>=4).sort((a,b)=>st[a].ok/st[a].n - st[b].ok/st[b].n).slice(0,2);
  weak.forEach(d=>take(pool.filter(q=>q.d===d),1,out));
  const cyc = [0,1,2].map(i=>CYCLE[(S.cyclePos+i)%CYCLE.length]);
  cyc.forEach(d=>take(pool.filter(q=>q.d===d),1,out));
  take(pool,10-out.length,out);
  return out.slice(0,10);
}
function answer(ctx, id, choice){
  const q = qById(id); const ok = q.t==="ce" ? (choice===q.a) : (choice===q.a);
  const k = TODAY();
  S.log.push(k+"|"+id+"|"+(ok?1:0)+"|"+(q.t==="ce"?(choice?"C":"E"):choice));
  if(S.log.length>6000) S.log = S.log.slice(-6000);
  // repetição espaçada
  const steps=[1,3,7,21];
  if(!ok){ S.err[id] = {due:addDays(k,1), step:0}; }
  else if(S.err[id] && ctx==="rev"){ const s=S.err[id].step+1; if(s>=steps.length) delete S.err[id]; else S.err[id]={due:addDays(k,steps[s]),step:s}; }
  if(ctx==="sim"){ const d=S.days[k]; d.simAns[id]=choice; if(d.simIds.every(x=>x in d.simAns)){ d.simDone=true; const t=d.tasks.find(x=>x.k==="sim"); if(t) t.done=true; } }
  if(ctx==="rev"){ const due = Object.keys(S.err).filter(i=>S.err[i].due<=k); if(!due.length){ const t=S.days[k].tasks.find(x=>x.k==="rev"); if(t) t.done=true; } }
  save(); return ok;
}

// ======== ALERTAS DE DESEMPENHO ========
function streaks(){
  const keys = Object.keys(S.days).sort(); let best=0, run=0, prev=null;
  for(const k of keys){ if(dayCounts(k)){ run = (prev && diffDays(prev,k)===1) ? run+1 : 1; prev=k; best=Math.max(best,run);} }
  let cur=0, k=TODAY(); if(!dayCounts(k)) k=addDays(k,-1);
  while(dayCounts(k)){ cur++; k=addDays(k,-1); }
  return {cur,best,total:keys.filter(dayCounts).length};
}
function acc(from,to){ let n=0,ok=0; for(const e of S.log){ const [k,,o]=e.split("|"); if(k>=from && k<=to){ n++; if(o==="1") ok++; } } return {n,ok,p:n?ok/n:null}; }
function alerts(){
  const out=[], t=TODAY();
  const w1 = acc(addDays(t,-6),t), w0 = acc(addDays(t,-13),addDays(t,-7));
  if(w1.n>=10){
    const p=Math.round(w1.p*100);
    if(p<60) out.push(["bad","Crítico","Acerto de "+p+"% nos últimos 7 dias","Abaixo de 60%. No estilo Cebraspe, cada erro anula um acerto. Reduza a teoria nova e dobre a revisão de erros nesta semana."]);
    else if(p<70) out.push(["warn","Atenção","Acerto de "+p+"% nos últimos 7 dias","A meta é 70% ou mais. Refaça os erros antes de avançar no ciclo."]);
    else out.push(["good","No alvo","Acerto de "+p+"% nos últimos 7 dias","Ritmo de aprovação. Mantenha as revisões."]);
    if(w0.n>=10 && (w1.p-w0.p)<=-0.05) out.push(["warn","Queda","Desempenho caiu "+Math.round((w0.p-w1.p)*100)+" pontos em relação à semana anterior","Verifique cansaço e volume. Uma semana mais leve com revisão costuma recuperar o rendimento."]);
  }
  const st = discStats(addDays(t,-29));
  Object.keys(st).forEach(d=>{ const s=st[d]; if(s.n>=5 && s.ok/s.n<0.55) out.push(["bad","Ponto fraco",DISC[d].s+": "+Math.round(s.ok/s.n*100)+"% de acerto em 30 dias","Releia o guia de "+DISC[d].s+" e faça um treino só dessa disciplina na aba Simulado."]); });
  const y = addDays(t,-1);
  if(diffDays(S.start,t)>=1 && !dayCounts(y)) out.push(["warn","Ontem","A meta de ontem não foi cumprida","Sem culpa: o ciclo continua de onde parou. Hoje, faça pelo menos o simulado e um bloco."]);
  const due = Object.keys(S.err).filter(i=>S.err[i].due<=t).length;
  if(due>=15) out.push(["warn","Revisão","Há "+due+" questões erradas aguardando revisão","Revisão acumulada vira esquecimento. Use 15 minutos hoje só para elas."]);
  const lastSeen = {}; Object.keys(S.days).forEach(k=>S.days[k].tasks.forEach(x=>{ if(x.type==="block"&&x.done) lastSeen[x.disc]=k>(lastSeen[x.disc]||"")?k:lastSeen[x.disc]; }));
  if(diffDays(S.start,t)>=14) Object.keys(DISC).forEach(d=>{ if(!lastSeen[d] || diffDays(lastSeen[d],t)>12) out.push(["warn","Sem contato",DISC[d].s+" não é estudada há mais de 12 dias","Ela entra no próximo bloco do ciclo. Não pule."]); });
  const s = streaks();
  if(s.cur>=7) out.push(["good","Sequência",s.cur+" dias seguidos de meta cumprida","Consistência é o que aprova. Continue."]);
  if(!out.length) out.push(["good","Início","Sem dados suficientes ainda","Os alertas aparecem depois de 10 questões respondidas na semana. Faça o simulado de hoje."]);
  return out.slice(0,6);
}

function bindNew(v){
  v.querySelectorAll("[data-longrev]").forEach(b=>b.onclick=()=>{ ui.showSum=false; ui.i=0; render(); });
  v.querySelectorAll("[data-fstart]").forEach(b=>b.onclick=()=>{ const l=flashList(); if(!l.length){ toast("Nenhum cartão para hoje. Volte amanhã."); return; } ui.flash={list:l,i:0,show:false,n:0}; render(); });
  v.querySelectorAll("[data-fshow]").forEach(b=>b.onclick=()=>{ ui.flash.show=true; render(); });
  v.querySelectorAll("[data-fquit]").forEach(b=>b.onclick=()=>{ ui.flash=null; render(); });
  v.querySelectorAll("[data-frate]").forEach(b=>b.onclick=()=>{
    const f=ui.flash, id=f.list[f.i], t=TODAY(), steps=[1,3,7,21,45]; S.flash=S.flash||{}; S.flashLog=S.flashLog||{};
    const box = b.dataset.frate==="1" ? Math.min(4,((S.flash[id]||{}).box||0)+1) : 0;
    S.flash[id]={box,due:addDays(t,steps[box])}; S.flashLog[t]=(S.flashLog[t]||0)+1; f.i++; f.show=false; f.n++;
    if(f.i>=f.list.length){ ui.flash=null; markTask("flash"); toast("Sessão de flashcards concluída."); }
    save(); render();
  });
  v.querySelectorAll("[data-lei]").forEach(b=>b.onclick=()=>{ const id=b.dataset.lei, t=TODAY(); S.lei=S.lei||{}; const x=S.lei[id]||{n:0}; if(x.last===t){ toast("Este bloco já foi marcado hoje."); return; } S.lei[id]={n:x.n+1,last:t}; S.leiLog=(S.leiLog||[]).concat(t).slice(-400); markTask("lei"); save(); render(); toast("Leitura registrada."); });
  v.querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>{ ui.drillIdx=+b.dataset.drill; ui.drillShow=false; render(); });
  const ds=$("#drill-show"); if(ds) ds.onclick=()=>{ const ta=$("#drill"); if(ta.value.trim().split(/\s+/).length<25){ toast("Escreva pelo menos 25 palavras antes de ver o espelho."); return; } const i=ui.drillIdx||0; S.drills=S.drills||{}; S.drills[i]=Object.assign({},S.drills[i],{text:ta.value}); ui.drillShow=true; save(); render(); };
  const sv=$("#drill-save"); if(sv) sv.onclick=()=>{ const i=ui.drillIdx||0, t=TODAY(), ta=$("#drill"); S.drills=S.drills||{}; const hits=[...v.querySelectorAll("[data-dpt]")].filter(c=>c.checked).map(c=>+c.dataset.dpt); const first=!(S.drills[i]&&S.drills[i].at===t);
    S.drills[i]={text:ta.value,hits,at:t}; if(first){ S.drillLog=(S.drillLog||[]).concat(t).slice(-400); markTask("disc"); } save(); render(); toast("Autoavaliação salva: "+hits.length+"/"+ESSAY_DRILLS[i].pts.length+" pontos."); };
}

function vProgresso(){
  const t=TODAY(), st=streaks(), ds=discStats();
  // heatmap 16 semanas
  const weeks=16, start=addDays(t,-weeks*7-parseKey(t).getDay());
  let cells="", cs=13, gap=3;
  for(let w=0;w<weeks+1;w++) for(let dw=0;dw<7;dw++){
    const k=addDays(start,w*7+dw); if(k>t) continue;
    const p=dayPct(k), lvl = !S.days[k]?0 : p===0?0 : p<0.6?1 : p<0.8?2 : p<1?3 : 4;
    cells+=`<rect x="${30+w*(cs+gap)}" y="${dw*(cs+gap)}" width="${cs}" height="${cs}" rx="2" fill="var(--h${lvl})"><title>${fmtDate(k)}: ${S.days[k]?Math.round(p*100)+"% da meta":"sem registro"}</title></rect>`;
  }
  const hw = 30+(weeks+1)*(cs+gap);
  const dl=["D","S","T","Q","Q","S","S"].map((x,i)=>i%2?`<text x="0" y="${i*(cs+gap)+10}">${x}</text>`:"").join("");
  // acerto semanal (8 semanas)
  const pts=[]; for(let i=7;i>=0;i--){ const to=addDays(t,-i*7), a=acc(addDays(to,-6),to); pts.push({k:to,p:a.p,n:a.n}); }
  const W=560,H=170,px=36,py=14, x=i=>px+i*(W-px-12)/7, y=v=>py+(1-v)*(H-py-24);
  const valid=pts.map((p,i)=>({...p,i})).filter(p=>p.p!=null);
  const line = valid.map((p,j)=>(j?"L":"M")+x(p.i)+" "+y(p.p)).join(" ");
  const area = valid.length>1 ? line+` L${x(valid[valid.length-1].i)} ${y(0)} L${x(valid[0].i)} ${y(0)} Z` : "";
  const grid=[0,.5,.7,1].map(v=>`<line x1="${px}" x2="${W-12}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===.7?'stroke-dasharray="4 3" stroke="var(--muted)"':""}/><text x="0" y="${y(v)+3}">${v*100}%</text>`).join("");
  const xl=pts.map((p,i)=>`<text x="${x(i)-14}" y="${H-4}">${fmtDate(p.k).replace(" de ","/").replace(".","")}</text>`).join("");
  const dots=valid.map((p,j)=>`<circle cx="${x(p.i)}" cy="${y(p.p)}" r="${j===valid.length-1?5:4}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"><title>Semana até ${fmtDate(p.k)}: ${Math.round(p.p*100)}% em ${p.n} questões</title></circle>`).join("");
  return `
  <section style="display:grid;gap:6px"><div class="eyebrow">Progresso de Jullio</div><h1 style="font-size:1.8rem">Dias de progresso</h1></section>
  <div class="stats">
    <div><b>${st.cur}</b><span>sequência atual</span></div><div><b>${st.best}</b><span>melhor sequência</span></div>
    <div><b>${st.total}</b><span>dias com meta</span></div><div><b>${diffDays(S.start,t)+1}</b><span>dias desde o início</span></div>
  </div>
  <section class="card" style="display:grid;gap:10px"><h2>Calendário de metas · 16 semanas</h2>
    <div class="chart"><svg width="${hw}" height="${7*(cs+gap)}" role="img" aria-label="Calendário de cumprimento da meta diária">${dl}${cells}</svg></div>
    <div class="legend">Menos <i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i> Meta completa</div>
  </section>
  <section class="card" style="display:grid;gap:10px"><h2>Acerto semanal</h2><p class="note" style="margin:0">Linha tracejada: meta de 70%.</p>
    ${valid.length?`<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="Percentual de acerto por semana">${grid}${area?`<path d="${area}" fill="var(--accent)" opacity=".12"/>`:""}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}${xl}</svg></div>`:`<p class="muted">O gráfico aparece depois do primeiro simulado.</p>`}
  </section>
  <section class="card" style="display:grid;gap:6px"><h2>Acerto por disciplina</h2><p class="note" style="margin:0 0 6px">Marca vertical: meta de 70%.</p>
    ${Object.keys(DISC).map(d=>{const s=ds[d], p=s.n?s.ok/s.n:0; return `<div class="hbar"><span>${esc(DISC[d].s)}</span><span class="t"><i style="width:${p*100}%;background:${!s.n?"var(--h0)":p<.55?"var(--bad)":p<.7?"var(--warn)":"var(--h3)"}"></i><span class="goal"></span></span><span class="v">${s.n?Math.round(p*100)+"%":"–"}</span></div>`;}).join("")}
    <p class="note">Barras vermelhas (abaixo de 55%) e amarelas (55% a 69%) geram alertas na aba Hoje.</p>
  </section>
  <section class="card row" style="justify-content:space-between"><div><b>Recomeçar do zero</b><div class="muted" style="font-size:.92rem">Apaga todo o progresso e reinicia no dia de hoje.</div></div>
    <div class="row">${ui.confirmReset?`<button data-reset="yes" style="border-color:var(--bad);color:var(--bad)">Confirmar: apagar tudo</button><button data-reset="no">Cancelar</button>`:`<button data-reset="ask">Recomeçar</button>`}</div></section>`;
}

function themeKey(r){ const m=String(r).match(/^([^,;]+(?:,\s*art\.\s*\d+[º°-]?[A-Z]?)?)/); return m?m[1].trim():r; }
function reportData(){
  const t=TODAY(), since=addDays(t,-29), per={}, th={};
  Object.keys(DISC).forEach(d=>per[d]={n:0,ok:0,n30:0,ok30:0});
  let markC=0, markE=0;
  for(const e of S.log){ const [k,id,o,c]=e.split("|"); const q=qById(id); if(!q) continue; const P=per[q.d];
    P.n++; if(o==="1") P.ok++; if(k>=since){ P.n30++; if(o==="1") P.ok30++; }
    const tk=themeKey(q.r); th[tk]=th[tk]||{n:0,ok:0,d:q.d}; th[tk].n++; if(o==="1") th[tk].ok++;
    if(q.t==="ce" && o==="0"){ if(c==="C") markC++; else if(c==="E") markE++; } }
  const rows=Object.keys(DISC).map(d=>{ const P=per[d], a=P.n30>=3?P.ok30/P.n30:(P.n?P.ok/P.n:null), w=CYCLE.filter(x=>x===d).length;
    const gd=GUIDES[d].topics.filter((_,i)=>S.guide[d+"-"+i]).length, gt=GUIDES[d].topics.length;
    const gap=a==null?0.45:Math.max(0,0.8-a), conf=a==null?0.6:Math.min(1,(P.n30||P.n)/8)*0.7+0.3;
    return {d,n:P.n,a,w,gd,gt,score:w*gap*conf+(1-gd/gt)*0.06*w}; }).sort((x,y)=>y.score-x.score);
  const max=Math.max(...rows.map(r=>r.score),0.0001); rows.forEach(r=>r.rel=r.score/max);
  const themes=Object.entries(th).filter(([,v])=>v.n>=2 && v.ok/v.n<0.7).map(([k,v])=>({k,...v,p:v.ok/v.n})).sort((a,b)=>a.p-b.p||b.n-a.n).slice(0,8);
  const days14=[...Array(14)].map((_,i)=>addDays(t,-i)).filter(k=>k>=S.start && dayCounts(k)).length;
  const span14=Math.min(14,diffDays(S.start,t)+1);
  return {rows,themes,markC,markE,days14,span14,w1:acc(addDays(t,-6),t),w0:acc(addDays(t,-13),addDays(t,-7)),errN:Object.keys(S.err).length,total:acc("0000",t)};
}
function actionFor(r){
  if(r.a==null) return "Ainda sem medição. Faça um treino de 10 questões de "+DISC[r.d].s+" para o app saber seu nível.";
  if(r.a<0.55) return "Volte à base: releia o guia inteiro, leia a lei seca do tema e faça 2 treinos de 10 questões nesta semana.";
  if(r.a<0.7) return "Quase lá: 1 treino de 10 questões a cada 2 dias e refaça todos os erros do caderno.";
  return "Manutenção: 1 treino por semana e revisão dos erros.";
}
function insights(R){
  const out=[];
  if(R.total.n<10) out.push("Ainda há poucos dados ("+R.total.n+" questões). O relatório fica preciso a partir de 30 questões respondidas.");
  if(R.markC+R.markE>=4){
    if(R.markC>=R.markE*1.5) out.push("Nos itens de certo/errado, você marca Certo em itens errados ("+R.markC+" vezes contra "+R.markE+"). Tende a aceitar generalizações: procure a palavra que torna o item falso (sempre, apenas, obrigatoriamente, deve).");
    else if(R.markE>=R.markC*1.5) out.push("Nos itens de certo/errado, você marca Errado em itens certos ("+R.markE+" vezes contra "+R.markC+"). Há desconfiança em excesso: itens que reproduzem a letra da lei costumam estar certos.");
  }
  if(R.span14>=5 && R.days14/R.span14<0.7) out.push("Consistência: meta cumprida em "+R.days14+" de "+R.span14+" dias. Reduza o tempo diário na aba Hoje para um valor que você cumpra todos os dias.");
  if(R.w1.n>=10 && R.w0.n>=10){ const dlt=Math.round((R.w1.p-R.w0.p)*100); out.push("Acerto desta semana: "+Math.round(R.w1.p*100)+"% ("+(dlt>=0?"+":"")+dlt+" pontos em relação à semana anterior)."); }
  if(R.errN>=20) out.push("O caderno de erros tem "+R.errN+" questões. Antes de avançar no ciclo, zere as revisões vencidas.");
  return out;
}
function weakList(){
  const R=reportData(), seen=new Set(S.log.map(e=>e.split("|")[1])), out=[];
  const themeKeys=new Set(R.themes.map(t=>t.k));
  Object.keys(S.err).forEach(id=>{ const q=qById(id); if(q && themeKeys.has(themeKey(q.r)) && out.length<5) out.push(id); });
  R.rows.slice(0,3).forEach(r=>{ allQ().filter(q=>q.d===r.d && !seen.has(q.id) && !out.includes(q.id)).slice(0,2).forEach(q=>out.length<10&&out.push(q.id)); });
  allQ().filter(q=>q.d===R.rows[0].d && !out.includes(q.id)).forEach(q=>out.length<10&&out.push(q.id));
  return out;
}

// ======== PACOTE OFFLINE (.zip gerado no navegador) ========
function crc32(u8){ let c, t=crc32.t; if(!t){ t=crc32.t=new Uint32Array(256); for(let n=0;n<256;n++){ c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } } c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=t[(c^u8[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){ // files: [{name, data:Uint8Array}]
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const f of files){ const nm=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
    const h=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
    parts.push(h,nm,f.data);
    central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=h.length+nm.length+sz; }
  const cdSize=central.reduce((s,a)=>s+a.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...central,end],{type:"application/zip"});
}
async function downloadZip(){
  try{
    const names=["index.html","data.js","manifest.webmanifest","icon.svg","icon-192.png","icon-512.png"], files=[];
    for(const n of names){ const r=await fetch(n,{cache:"no-store"}); if(!r.ok) throw 0; files.push({name:"rota-anpd/"+n,data:new Uint8Array(await r.arrayBuffer())}); }
    files.push({name:"rota-anpd/LEIA-ME.txt",data:new TextEncoder().encode("Rota ANPD - app de estudos do Jullio\r\n\r\nUso offline: descompacte a pasta e abra o index.html no navegador.\r\nO progresso fica salvo no navegador usado. Para levar o progresso a outro aparelho, use Notificações e download > Exportar backup.\r\nVersão online e instalável: "+SITE_URL+"\r\n")});
    const a=document.createElement("a"); a.href=URL.createObjectURL(zipStore(files)); a.download="rota-anpd.zip"; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800); toast("Download do pacote iniciado.");
  }catch(e){ toast("Não foi possível montar o pacote. Verifique a conexão e tente de novo."); }
}

// ======== MEDIDOR DE EVOLUÇÃO ========
function weekStart(k){ const d=parseKey(k), wd=(d.getDay()+6)%7; return addDays(k,-wd); }
function weekStats(ws){
  const we=addDays(ws,6), a=acc(ws,we); let days=0, essays=0;
  for(let i=0;i<7;i++){ const k=addDays(ws,i); if(dayCounts(k)) days++; }
  (S.essayLog||[]).forEach(k=>{ if(k>=ws && k<=we) essays++; });
  const inW=k=>k>=ws&&k<=we, cnt=arr=>(arr||[]).filter(inW).length;
  let flash=0; Object.keys(S.flashLog||{}).forEach(k=>{ if(inW(k)) flash+=S.flashLog[k]; });
  return {ws,we,n:a.n,ok:a.ok,p:a.p,days,essays,flash,drills:cnt(S.drillLog),lei:cnt(S.leiLog),long:(S.longSims||[]).filter(x=>inW(x.k)).length};
}
function readiness(){
  const t=TODAY(), R=reportData();
  let tot=0, dom=0; Object.keys(GUIDES).forEach(d=>GUIDES[d].topics.forEach((_,i)=>{ tot++; if(S.guide[d+"-"+i]) dom++; }));
  let wsum=0, asum=0; R.rows.forEach(r=>{ wsum+=r.w; asum+=r.w*(r.a==null?0:Math.min(1,r.a/0.8)); });
  const span=Math.min(14,diffDays(S.start,t)+1); let dd=0; for(let i=0;i<span;i++) if(dayCounts(addDays(t,-i))) dd++;
  const parts=[
    {k:"Cobertura do conteúdo",v:dom/tot,w:30,info:dom+" de "+tot+" tópicos dominados"},
    {k:"Acerto ponderado pelo peso",v:asum/wsum,w:40,info:"alvo: 80% em cada disciplina"},
    {k:"Consistência (14 dias)",v:dd/Math.max(1,span),w:20,info:dd+" de "+span+" dias com meta"},
    {k:"Volume de questões",v:Math.min(1,R.total.n/1000),w:10,info:R.total.n+" de 1.000 questões"}
  ];
  const score=Math.round(parts.reduce((s,p)=>s+p.v*p.w,0));
  const level= score<25?"Base em construção": score<50?"Em desenvolvimento": score<70?"Competitivo": score<85?"Aprovável":"Pronto para a prova";
  return {score,parts,level};
}
function milestones(){
  const R=reportData(), st=streaks(), ds=discStats(), lg=ds.lgpd;
  const lgTopics=GUIDES.lgpd.topics.length, lgDone=GUIDES.lgpd.topics.filter((_,i)=>S.guide["lgpd-"+i]).length;
  return [
    ["Primeiro simulado completo", Object.values(S.days).some(d=>d.simDone)],
    ["100 questões respondidas", R.total.n>=100],
    ["500 questões respondidas", R.total.n>=500],
    ["1.000 questões respondidas", R.total.n>=1000],
    ["7 dias seguidos de meta", st.best>=7],
    ["30 dias seguidos de meta", st.best>=30],
    ["Primeira volta completa do ciclo", S.cyclePos>=CYCLE.length],
    ["Todos os tópicos de LGPD dominados", lgDone===lgTopics],
    ["LGPD com 75% de acerto (mín. 30 questões)", lg.n>=30 && lg.ok/lg.n>=0.75],
    ["Primeira redação concluída", (S.essayLog||[]).length>=1],
    ["Acerto geral de 70% (mín. 200 questões)", R.total.n>=200 && R.total.p>=0.7],
    ["Primeiro simuladão cronometrado", (S.longSims||[]).length>=1],
    ["Simuladão com 75% de aproveitamento", (S.longSims||[]).some(x=>x.n>=25 && x.ok/x.n>=0.75)],
    ["30 flashcards dominados", FLASH.filter(c=>((S.flash||{})[c.id]||{}).box>=3).length>=30],
    ["LGPD inteira lida 3 vezes", LEI_BLOCKS.filter(b=>b.n==="LGPD").every(b=>((S.lei||{})[b.id]||{}).n>=3)],
    ["5 discursivas curtas com 3+ pontos", Object.values(S.drills||{}).filter(x=>x.at&&(x.hits||[]).length>=3).length>=5]
  ];
}
function vMedidor(){
  const ph=phaseInfo(), G=PHASE_GOALS[ph.idx], t=TODAY(), cur=weekStats(weekStart(t)), rd=readiness(), ms=milestones();
  const bar=(v,goal,fmt)=>{ const p=Math.max(0,Math.min(1,goal?v/goal:0)); return `<div class="bar" style="flex:1"><i style="width:${p*100}%;background:${p>=1?"var(--good)":"var(--accent)"}"></i></div><span class="ref">${fmt}</span>`; };
  const hist=[]; for(let i=7;i>=0;i--) hist.push(weekStats(addDays(weekStart(t),-7*i)));
  const R=reportData(), gtot=Object.keys(GUIDES).reduce((s,d)=>s+GUIDES[d].topics.length,0), gdone=Object.keys(S.guide).filter(k=>S.guide[k]).length;
  const weeks=Math.max(1,Math.ceil((diffDays(S.start,t)+1)/7)), pace=gdone/weeks, left=gtot-gdone;
  return `
  <section class="card" style="display:grid;gap:12px">
    <div class="row" style="justify-content:space-between"><h2>Índice de prontidão</h2><span class="chip">${esc(rd.level)}</span></div>
    <div class="row" style="align-items:baseline;gap:8px"><span class="daynum" style="font-size:3rem">${rd.score}</span><span class="muted">de 100</span></div>
    ${rd.parts.map(p=>`<div class="hbar" style="grid-template-columns:180px 1fr 60px"><span>${esc(p.k)} <span class="muted">(${p.w})</span></span><span class="t" title="${esc(p.info)}"><i style="width:${Math.round(p.v*100)}%"></i></span><span class="v">${Math.round(p.v*p.w)}/${p.w}</span></div>`).join("")}
    <p class="note" style="margin:0">Faixas: 0–24 base em construção · 25–49 em desenvolvimento · 50–69 competitivo · 70–84 aprovável · 85+ pronto para a prova.</p>
  </section>
  <section class="card" style="display:grid;gap:10px">
    <div class="row" style="justify-content:space-between"><h2>Metas desta semana</h2><span class="ref">${esc(PHASES[ph.idx].n)}</span></div>
    <div class="row">${"Questões"}${bar(cur.n,G.q,cur.n+"/"+G.q)}</div>
    <div class="row">Dias com meta${bar(cur.days,G.days,cur.days+"/"+G.days)}</div>
    <div class="row">Acerto${bar(cur.p||0,G.acc,cur.p==null?"–":Math.round(cur.p*100)+"% / "+Math.round(G.acc*100)+"%")}</div>
    ${G.essays?`<div class="row">Redações${bar(cur.essays,G.essays,cur.essays+"/"+G.essays)}</div>`:""}
    <p class="note" style="margin:0">As metas sobem a cada fase. Semana de segunda a domingo.</p>
  </section>
  <section class="card" style="display:grid;gap:10px"><h2>Formas de evolução nesta semana</h2>
    <div class="tbl"><table class="plan"><thead><tr><th>Forma de treino</th><th>O que desenvolve</th><th>Feito</th><th>Alvo</th></tr></thead><tbody>
    ${[["Questões objetivas","Acerto e velocidade",cur.n,G.q],["Flashcards","Memória de prazos e números",cur.flash,50],["Lei seca (blocos)","Literalidade da norma",cur.lei,3],["Discursivas curtas","Organizar a resposta",cur.drills,1],["Redação completa","Texto de prova",cur.essays,G.essays],["Simuladão cronometrado","Resistência e gestão do tempo",cur.long,1]].map(r=>`<tr><td>${r[0]}</td><td class="muted">${r[1]}</td><td><b style="color:${r[3]&&r[2]>=r[3]?"var(--good)":"var(--ink)"}">${r[2]}</b></td><td>${r[3]||"–"}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note" style="margin:0">Uma semana equilibrada toca em todas as linhas. Se uma ficar zerada por duas semanas, ela vira a prioridade.</p>
  </section>
  <section class="card" style="display:grid;gap:10px"><h2>Histórico semanal</h2>
    <div class="tbl"><table class="plan"><thead><tr><th>Semana</th><th>Questões</th><th>Acerto</th><th>Dias com meta</th><th>Redações</th></tr></thead><tbody>
    ${hist.filter(w=>w.we>=S.start).map(w=>`<tr><td>${esc(fmtDate(w.ws))}</td><td>${w.n}</td><td>${w.p==null?"–":Math.round(w.p*100)+"%"}</td><td>${w.days}/7</td><td>${w.essays}</td></tr>`).join("")}
    </tbody></table></div>
  </section>
  <section class="card" style="display:grid;gap:10px"><h2>Projeção</h2>
    <p style="margin:0;max-width:70ch">${gdone?`No ritmo atual (${pace.toFixed(1)} tópicos dominados por semana), faltam cerca de <b>${Math.ceil(left/Math.max(pace,0.1))} semanas</b> para dominar os ${left} tópicos restantes.`:`Marque tópicos como dominados nos Guias para o app projetar quando você cobre todo o conteúdo.`} ${R.total.p!=null&&R.total.p<0.7?"Antes disso, a prioridade é levar o acerto geral a 70%.":""}</p>
  </section>
  <section class="card" style="display:grid;gap:10px"><h2>Marcos</h2>
    <ul class="tasks">${ms.map(m=>`<li class="${m[1]?"done":""}" style="grid-template-columns:28px 1fr"><span aria-hidden="true" style="font-weight:700;color:${m[1]?"var(--good)":"var(--muted)"}">${m[1]?"✓":"○"}</span><span class="tl" style="${m[1]?"text-decoration:none":""}">${esc(m[0])}</span></li>`).join("")}</ul>
  </section>`;
}

// ======== REDAÇÃO ========
function vRedacao(){
  if(ui.mode) return vQuiz();
  const E=ESSAY_GUIDE, i=ui.essayIdx||0, tm=E.temas[i], draft=(S.essays||{})[i]||{}, txt=draft.text||"";
  const words=txt.trim()?txt.trim().split(/\s+/).length:0, lines=Math.ceil(txt.length/70);
  const cats=[...new Set(E.repertorio.map(r=>r[0]))];
  return `
  <section style="display:grid;gap:6px"><div class="eyebrow">Parte escrita</div><h1 style="font-size:1.8rem">Redação e repertório</h1>
  <p class="muted" style="margin:0;max-width:70ch">${esc(E.aviso)}</p></section>
  <div class="grid2">
    <section class="card"><h2>Estrutura do texto</h2><ol class="rules" style="margin-top:8px">${E.estrutura.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></section>
    <section class="card"><h2>Checklist de correção</h2><ul class="rules" style="margin-top:8px">${E.criterios.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>
  </div>
  <section class="card" style="display:grid;gap:10px"><h2>Temas prováveis</h2>
    <div class="disc-pick">${E.temas.map((x,j)=>`<button data-etema="${j}" aria-pressed="${j===i}">Tema ${j+1}${(S.essays||{})[j]&&S.essays[j].done?" ✓":""}</button>`).join("")}</div>
    <h3>${esc(tm.t)}</h3>
    <div class="grid2">
      <div><b>Tópicos a abordar</b><ul>${tm.topicos.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><b>Normas para citar</b><ul>${tm.normas.map(x=>`<li><span class="ref">${esc(x)}</span></li>`).join("")}</ul></div>
      <div><b>Argumentos</b><ul>${tm.args.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><b>Proposta de conclusão</b><p style="margin:4px 0 0">${esc(tm.proposta)}</p></div>
    </div>
    <label for="essay" class="eyebrow">Seu texto (rascunho salvo automaticamente)</label>
    <textarea id="essay" rows="14" style="width:100%;font:inherit;line-height:1.6;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)" placeholder="Escreva aqui em até 40 minutos, sem consulta.">${esc(txt)}</textarea>
    <div class="row" style="justify-content:space-between"><span class="ref" id="ecount">${words} palavras · ~${lines} linhas</span>
      <div class="row"><button id="e-done">${draft.done?"Concluída ✓":"Marcar como concluída"}</button>${sample?`<button class="primary" id="e-ai" ${ui.essayBusy?"disabled":""}>${ui.essayBusy?"Corrigindo…":"Corrigir com IA"}</button>`:""}</div></div>
    ${draft.fb?`<div class="feedback"><b>Correção (IA, orientativa):</b><div style="white-space:pre-wrap;margin-top:6px">${esc(draft.fb)}</div></div>`:""}
  </section>
  ${vDrills()}
  <section class="card" style="display:grid;gap:10px"><h2>Banco de repertório</h2>
    ${cats.map(c=>`<div><div class="eyebrow" style="margin-bottom:4px">${esc(c)}</div><ul style="margin:0;padding-left:18px;display:grid;gap:4px;max-width:72ch">${E.repertorio.filter(r=>r[0]===c).map(r=>`<li>${esc(r[1])}</li>`).join("")}</ul></div>`).join("")}
    <p class="note" style="margin:0">Use repertório como apoio ao argumento, sem decorar números que você não tem certeza.</p>
  </section>`;
}
let essayTimer=null;
function bindRedacao(v){
  v.querySelectorAll("[data-etema]").forEach(b=>b.onclick=()=>{ ui.essayIdx=+b.dataset.etema; render(); });
  const ta=$("#essay"); if(!ta) return; const i=ui.essayIdx||0;
  ta.addEventListener("input",()=>{ const txt=ta.value, w=txt.trim()?txt.trim().split(/\s+/).length:0; $("#ecount").textContent=w+" palavras · ~"+Math.ceil(txt.length/70)+" linhas";
    clearTimeout(essayTimer); essayTimer=setTimeout(()=>{ S.essays=S.essays||{}; S.essays[i]=Object.assign({},S.essays[i],{text:txt,at:TODAY()}); save(); },800); });
  $("#e-done").onclick=()=>{ S.essays=S.essays||{}; const d=S.essays[i]=Object.assign({},S.essays[i],{text:ta.value}); if(!d.done){ d.done=TODAY(); S.essayLog=(S.essayLog||[]).concat(TODAY()); toast("Redação registrada no medidor."); } save(); render(); };
  const ai=$("#e-ai"); if(ai) ai.onclick=async()=>{
    const txt=ta.value.trim(); if(txt.split(/\s+/).length<80){ toast("Escreva pelo menos 80 palavras antes de corrigir."); return; }
    ui.essayBusy=true; render(); const tm=ESSAY_GUIDE.temas[i];
    try{ const r=await sample(`Você é corretor de provas discursivas de concursos de agências reguladoras (padrão Cebraspe). Corrija o texto abaixo sobre o tema: "${tm.t}". Tópicos esperados: ${tm.topicos.join("; ")}.
Dê: 1) nota de 0 a 10 para conteúdo (cobertura dos tópicos e fundamentação legal) e de 0 a 10 para expressão (gramática, coesão); 2) três pontos fortes; 3) três ajustes concretos, citando trechos; 4) uma sugestão de repertório ou norma que faltou. Seja direto, em português, sem markdown.

TEXTO:
${txt}`,{modelTier:"default"});
      S.essays[i]=Object.assign({},S.essays[i],{text:ta.value,fb:r.text}); save();
    }catch(e){ toast(e&&e.code==="not_granted"?"Permissão para usar o Claude não concedida.":"Não foi possível corrigir agora."); }
    ui.essayBusy=false; render();
  };
}

// ======== EVENTOS ========
function bind(r){
  const v=$("#view");
  v.querySelectorAll("[data-task]").forEach(el=>el.addEventListener("change",e=>toggleTask(TODAY(),el.dataset.task,el.checked)));
  const mn=$("#minutes"); if(mn) mn.addEventListener("change",()=>{ S.minutes=+mn.value; save(); toast("Tempo atualizado. Vale a partir de amanhã."); });
  v.querySelectorAll("[data-gdisc]").forEach(b=>b.onclick=()=>{ ui.guideDisc=b.dataset.gdisc; render(); });
  v.querySelectorAll("[data-guide]").forEach(c=>c.addEventListener("change",()=>{ S.guide[c.dataset.guide]=c.checked; save(); render(); }));
  v.querySelectorAll("[data-tdisc]").forEach(b=>b.onclick=()=>{ ui.trainDisc=b.dataset.tdisc; render(); });
  v.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{
    const m=b.dataset.start, k=TODAY(); ui.mode=m; ui.i=0; ui.ansMap={}; ui.res={}; ui.longDone=false; ui.showSum=false;
    if(m==="long"){ ui.list=pickLong(); ui.t0=Date.now(); }
    if(m==="essayq"){ const r=rng("x"+Date.now()); ui.list=QB.filter(q=>q.id[0]==="x").map(q=>q.id).sort(()=>r()-.5); }
    if(m==="sim"){ ui.list=S.days[k].simIds; const f=ui.list.findIndex(id=>!(id in S.days[k].simAns)); ui.i=f<0?0:f; }
    if(m==="rev") ui.list=Object.keys(S.err).filter(i=>S.err[i].due<=k && qById(i)).slice(0,20);
    if(m==="weak"){ ui.list=weakList(); if(!ui.list.length){ ui.mode=null; toast("Responda mais questões para montar o treino."); return; } }
    if(m==="train"){ const r=rng("t"+Date.now()); ui.list=allQ().filter(q=>q.d===ui.trainDisc).map(q=>q.id).sort(()=>r()-.5).slice(0,10); }
    render();
  });
  v.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{
    const id=ui.list[ui.i], q=qById(id); const raw=b.dataset.ans; const ch = q.t==="ce" ? raw==="true" : +raw;
    if(ui.mode!=="sim" && id in ui.ansMap) return; const ok=answer(ui.mode,id,ch); ui.ansMap[id]=ch; ui.res[id]=ok; render();
  });
  v.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{ ui.i+=+b.dataset.step; render(); });
  v.querySelectorAll("[data-quit]").forEach(b=>b.onclick=()=>{ const m=ui.mode;
    if(m==="long" && !ui.longDone){ finishLong(); render(); window.scrollTo(0,0); return; }
    if(m==="weak" && Object.keys(ui.ansMap).length>=5){ markTask("weak"); save(); }
    ui.longDone=false; ui.showSum=false; ui.mode=null; render(); if(m==="sim" && S.days[TODAY()].simDone) toast("Simulado concluído e registrado."); });
  v.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>{ const a=b.dataset.reset; if(a==="ask") ui.confirmReset=true; else if(a==="no") ui.confirmReset=false; else { ui.confirmReset=false; S=blank(); ensureDay(); save(); toast("Progresso apagado."); } render(); });
  const ai=$("#ai-gen"); if(ai) ai.onclick=genAI;
  bindExtra(v);
  bindNew(v);
  if(r==="redacao") bindRedacao(v);
}

async function genAI(){
  if(!sample || ui.ai.busy) return; const d=ui.trainDisc;
  ui.ai={busy:true,msg:"Gerando questões de "+DISC[d].s+"…"}; render();
  const g=GUIDES[d];
  const prompt=`Você é examinador de concursos. Crie 5 questões INÉDITAS para o concurso de Especialista em Regulação de Proteção de Dados da ANPD (Brasil), disciplina: ${DISC[d].n}.
Tópicos: ${g.topics.map(t=>t.t).join("; ")}.
Use apenas fatos de que tenha certeza e cite o dispositivo legal. Misture 3 questões de certo/errado (estilo Cebraspe) e 2 de múltipla escolha com 5 alternativas (estilo FGV).
Responda SOMENTE um array JSON com objetos: {"t":"ce"|"me","q":"enunciado","o":["A","B","C","D","E"] (só para "me"),"a": true/false para "ce" ou índice 0-4 para "me","c":"comentário curto explicando o gabarito","r":"referência legal"}.`;
  try{
    const arr = await sample.json(prompt,{modelTier:"default"});
    const ts=Date.now().toString(36); let n=0;
    (Array.isArray(arr)?arr:[]).forEach((x,i)=>{ if(!x||!x.q||(x.t!=="ce"&&x.t!=="me")) return; if(x.t==="me"&&(!Array.isArray(x.o)||typeof x.a!=="number")) return; if(x.t==="ce"&&typeof x.a!=="boolean") return;
      S.aiQ.push({id:"ai"+ts+i,d,t:x.t,e:"IA",q:String(x.q),o:x.o,a:x.a,c:String(x.c||""),r:String(x.r||"")}); n++; });
    if(S.aiQ.length>120) S.aiQ=S.aiQ.slice(-120);
    save(); ui.ai={busy:false,msg:n+" questões novas de "+DISC[d].s+" adicionadas ao banco. Use “Treinar” para respondê-las."};
  }catch(e){ ui.ai={busy:false,msg: e&&e.code==="not_granted"?"Permissão para usar o Claude não concedida.":e&&e.code==="rate_limited"?"Limite de uso atingido. Tente mais tarde.":"Não foi possível gerar agora. Tente novamente em instantes."}; }
  render();
}

if(!location.hash) history.replaceState(null,"","#hoje");
ensureDay();
boot();
